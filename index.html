<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市場調査ツール</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23232f3e'/><path d='M14 44L26 30L36 38L50 20' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='50' cy='20' r='4' fill='%23ff9900'/></svg>">  
  <style>
    /* 全要素のサイズ計算を統一 */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* 親ページの余白とスクロールバーを完全に排除 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 親側のスクロールバーを完全に非表示 */
    }

    /* iframeをビューポート全体にフィットさせる */
    iframe {
      width: 100%;
      height: 100vh; /* 画面の高さいっぱいに固定 */
      border: none;
      display: block; /* 下部の余計な隙間を削除 */
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwL_yVB-3PuT3EoLtFkX9fiYlfZj17q4hincda3YKoITPpMRklabtK3GZgc_YJFXrIFEA/exec">
  </iframe>

</body>
</html>
